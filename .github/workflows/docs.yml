name: Deploy Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="0.4.43"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=/usr/local/bin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-doc-

      - name: Copy assets into mdBook source
        run: |
          mkdir -p docs/src/images
          cp resources/omecp-logo.svg docs/src/images/omecp-logo.svg

      - name: Build mdBook documentation
        run: mdbook build docs

      - name: Build Rust API documentation
        run: cargo doc --no-deps --all-features --document-private-items

      - name: Nest API docs inside the book output
        run: |
          # Move cargo doc output under docs/book/api/
          mkdir -p docs/book/api
          cp -r target/doc/. docs/book/api/

          # Add a redirect index for the API root
          CRATE_NAME=$(sed -n '/^\[package\]/,/^\[/{ s/^name *= *"\(.*\)"/\1/p }' Cargo.toml | head -1 | tr '[:upper:]' '[:lower:]' | tr '-' '_')
          echo "<meta http-equiv=\"refresh\" content=\"0; url=${CRATE_NAME}/index.html\">" > docs/book/api/index.html

      - name: Add .nojekyll
        run: touch docs/book/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5