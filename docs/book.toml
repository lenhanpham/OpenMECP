[book]
title = "OpenMECP Documentation"
authors = ["Le Nhan Pham"]
description = "High-performance Rust implementation of the MECP optimizer for quantum chemistry"
src = "src"
language = "en"

[preprocessor.katex]

[output.html]
site-url = "/OpenMECP/"
git-repository-url = "https://github.com/lenhanpham/OpenMECP"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/lenhanpham/OpenMECP/edit/main/docs/{path}"
additional-css = []
additional-js = ["theme/nav-title-link.js"]
no-section-label = false
fold.enable = true
fold.level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
